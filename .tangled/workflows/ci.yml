when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - nodejs_24
  - pnpm
  - chromium

environment:
  CHROME_BIN: "chromium"

steps:
  - name: "Install dependencies"
    command: pnpm install --frozen-lockfile --pm-on-fail=ignore --config.supportedArchitectures.libc=custom
  - name: "Lint"
    command: pnpm lint
  - name: "Test"
    command: pnpm test:ci
