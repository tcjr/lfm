when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - nodejs_24
  - pnpm
  - chromium

environment:
  CHROME_BIN: "chromium"
  # Add this flag to tell pnpm never to fetch or use the native @pnpm/exe bundle
  PNPM_EXEC_FROM_HOMEDIR: "false"

steps:
  - name: "Install dependencies"
    command: pnpm install --frozen-lockfile
  - name: "Lint"
    command: pnpm lint
  - name: "Test"
    command: pnpm test:ci
