when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - nodejs_24
  - pnpm
  - chromium

environment:
  CHROME_BIN: "chromium"
  # Applies the bypass settings globally to all pnpm subcommands
  PNPM_CONFIG_PM_ON_FAIL: "ignore"
  PNPM_CONFIG_SUPPORTED_ARCHITECTURES_LIBC: "custom"

steps:
  - name: "Install dependencies"
    command: pnpm install --frozen-lockfile
  - name: "Lint"
    command: pnpm lint
  - name: "Test"
    command: pnpm test:ci
