when:
  - event: ['push', 'manual']
    branch: ['main']
  - event: ['pull_request']
    branch: ['main']

engine: microvm
image: nixos

dependencies:
  - nodejs_24
  - pnpm
  - playwright-driver.browsers

environment:
  # Applies the bypass settings globally to all pnpm subcommands
  PNPM_CONFIG_PM_ON_FAIL: 'ignore'
  PNPM_CONFIG_SUPPORTED_ARCHITECTURES_LIBC: 'custom'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: 'true'

steps:
  - name: 'Install dependencies'
    command: pnpm install --frozen-lockfile
  - name: 'Lint'
    command: pnpm lint
  - name: 'Test'
    command: |
      export PLAYWRIGHT_BROWSERS_PATH=$(nix path-info nixpkgs#playwright-driver.browsers)
      pnpm test:ci
